name: Upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Install dependencies
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate source and types
      run: |
        set -euo pipefail
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public \
          --ns app.comp.container --ns app.config --ns app.main \
          --ns app.schema --ns app.updater --summary-only --format json

    - name: Select frontend CDN path
      id: asset-path
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        base_url="https://cos-sh.tiye.me/${prefix}"
        echo "VITE_BASE_URL=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Compile and build frontend
      run: |
        set -euo pipefail
        calcit calcit.cirru js
        yarn vite build --base="$VITE_BASE_URL"

    - name: Check current production revision
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: production
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
        if [[ "$GITHUB_SHA" == "$current_sha" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping superseded production build."
        fi

    # PR builds do not receive deploy secrets; enable upload only with protected
    # preview credentials/environment configured by the maintainer.
    - name: Upload and verify frontend assets
      if: steps.production.outputs.current == 'true'
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      if: steps.production.outputs.current == 'true'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: steps.production.outputs.current == 'true'
      run: echo "${{ steps.deploy.outputs.status }}"
